version: '3.8'

services:
  node0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcap-node0
    hostname: node0
    volumes:
      - ./testnet/node0:/root/.hcapd
    command: hcapd start --home /root/.hcapd --log_level info
    ports:
      - "26657:26657"  # RPC
      - "26656:26656"  # P2P
      - "1317:1317"    # REST API
      - "9090:9090"    # gRPC
    environment:
      - CHAIN_ID=hcap-testnet
      - MONIKER=node0
    networks:
      hcap-network:
        ipv4_address: 172.25.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcap-node1
    hostname: node1
    volumes:
      - ./testnet/node1:/root/.hcapd
    command: hcapd start --home /root/.hcapd --log_level info
    ports:
      - "26667:26657"
      - "26666:26656"
      - "1327:1317"
      - "9091:9090"
    environment:
      - CHAIN_ID=hcap-testnet
      - MONIKER=node1
    networks:
      hcap-network:
        ipv4_address: 172.25.0.11
    restart: unless-stopped
    depends_on:
      - node0

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcap-node2
    hostname: node2
    volumes:
      - ./testnet/node2:/root/.hcapd
    command: hcapd start --home /root/.hcapd --log_level info
    ports:
      - "26677:26657"
      - "26676:26656"
      - "1337:1317"
      - "9092:9090"
    environment:
      - CHAIN_ID=hcap-testnet
      - MONIKER=node2
    networks:
      hcap-network:
        ipv4_address: 172.25.0.12
    restart: unless-stopped
    depends_on:
      - node0

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcap-node3
    hostname: node3
    volumes:
      - ./testnet/node3:/root/.hcapd
    command: hcapd start --home /root/.hcapd --log_level info
    ports:
      - "26687:26657"
      - "26686:26656"
      - "1347:1317"
      - "9093:9090"
    environment:
      - CHAIN_ID=hcap-testnet
      - MONIKER=node3
    networks:
      hcap-network:
        ipv4_address: 172.25.0.13
    restart: unless-stopped
    depends_on:
      - node0

