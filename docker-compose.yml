  prometheus:
    image: prom/prometheus:latest
    container_name: hcap-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9099:9090"
    networks:
      hcap-network:
        ipv4_address: 172.25.0.100
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hcap-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      hcap-network:
        ipv4_address: 172.25.0.101
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  hcap-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
